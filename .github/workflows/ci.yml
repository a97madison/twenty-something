name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build core first: functions/ typecheck resolves @twenty-something/core
      # via its built dist/.d.ts (it's a workspace dep removed from the manifest
      # for deploy), so the types must exist before typecheck runs.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
